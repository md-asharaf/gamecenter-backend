spring.application.name=GameCenterServerless

# Serverless Optimizations
spring.main.lazy-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# AWS Configuration
aws.region=${AWS_REGION:ap-south-1}
aws.s3.import-bucket-name=${AWS_S3_IMPORT_BUCKET_NAME}

# Security / CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger UI / Static Content Encoding Fix
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
