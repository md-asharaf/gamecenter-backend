AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GameCenter Serverless Backend with Spring Cloud Function

Parameters:
  JwtSecret:
    Type: String
    Description: "Secret key for JWT generation (must be at least 32 characters)"
    NoEcho: true
  CorsAllowOrigins:
    Type: String
    Description: "Allowed origins for CORS (comma separated, e.g. https://gamecenter.vercel.app,http://localhost:3000)"
    Default: "http://localhost:3000"
  ImportBucketName:
    Type: String
    Description: "Specific name for the S3 bucket to import files (must be globally unique)"
    Default: "gamecenter-import-bucket"

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: java17
    CodeUri: target/serverless-0.0.1-SNAPSHOT-aws.jar
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1"
        JWT_SECRET: !Ref JwtSecret
        MAIN_CLASS: com.adnibog.gamecenter.GameCenterApplication
        CORS_ALLOWED_ORIGINS: !Ref CorsAllowOrigins
        AWS_S3_IMPORT_BUCKET_NAME: !Ref ImportBucketName

Resources:
  QuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Questions
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Projects
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  QuestionsImportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ImportBucketName
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
            AllowedOrigins: !Split [ ",", !Ref CorsAllowOrigins ]
            MaxAge: 3000

  ApiMonolithFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.adnibog.gamecenter.handlers.StreamLambdaHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - S3CrudPolicy:
            BucketName: !Ref ImportBucketName
      Events:
        CatchAll:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: "1.0"
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
            PayloadFormatVersion: "1.0"

  BatchCreateQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Timeout: 120
      MemorySize: 1024
      Handler: com.adnibog.gamecenter.handlers.S3BatchRequestHandler::handleRequest
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImportBucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref QuestionsTable
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref QuestionsImportBucket
            Events: s3:ObjectCreated:*

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
